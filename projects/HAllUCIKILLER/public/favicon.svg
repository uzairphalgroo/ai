<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0044" />
      <stop offset="50%" stop-color="#ff2a5f" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0614" />
      <stop offset="100%" stop-color="#060205" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Cyber Hexagon Shield -->
  <polygon points="32,3 58,18 58,46 32,61 6,46 6,18" fill="url(#bgGrad)" stroke="url(#neonGrad)" stroke-width="2.5" />

  <!-- Inner Hexagon Ring -->
  <polygon points="32,9 52,21 52,43 32,55 12,43 12,21" fill="none" stroke="#ff0044" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.6" />

  <!-- Cyber Lightning & Katana Edge -->
  <path d="M35,14 L19,34 L31,34 L27,50 L45,28 L33,28 Z" fill="url(#neonGrad)" filter="url(#glow)" />

  <!-- Core Neon Accent Spark -->
  <circle cx="32" cy="32" r="2" fill="#ffffff" filter="url(#glow)" />
</svg>
